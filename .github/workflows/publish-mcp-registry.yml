name: Publish Voidmail MCP Registry record

on:
  workflow_dispatch:
    inputs:
      hosted_mcp_served:
        description: Confirm the exact remote URL passed served MCP readback
        type: boolean
        required: true
        default: false

jobs:
  publish:
    if: github.repository == 'voidly-ai/mcp-email' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: mcp-registry-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check exact manifest and published package ownership
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .name == "io.github.voidly-ai/mcp-email" and
            (.packages | type) == "array" and
            (.packages | length) == 1 and
            .packages[0].registryType == "npm" and
            .packages[0].registryBaseUrl == "https://registry.npmjs.org" and
            .packages[0].identifier == "@voidly/mcp-email" and
            .packages[0].version == "1.2.1" and
            .packages[0].transport.type == "stdio" and
            (((.remotes // []) | length) == 0 or
              (((.remotes // []) | length) == 1 and
                .remotes[0].type == "streamable-http" and
                .remotes[0].url == "https://api.voidly.ai/mcp/mail")) and
            (((.remotes // []) | length) != 0 or .version == .packages[0].version)
          ' server.json >/dev/null
          remote_count="$(jq '(.remotes // []) | length' server.json)"
          if [ "$remote_count" -gt 0 ] && [ '${{ inputs.hosted_mcp_served }}' != 'true' ]; then
            echo 'Remote manifest requires served MCP readback confirmation.' >&2
            exit 1
          fi
          package_version="$(jq -r '.packages[0].version' server.json)"
          curl -fsSL "https://registry.npmjs.org/%40voidly%2Fmcp-email/${package_version}" \
            | jq -e '
                .name == "@voidly/mcp-email" and
                .version == "1.2.1" and
                .mcpName == "io.github.voidly-ai/mcp-email"
              ' >/dev/null

      - name: Download pinned MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          printf '%s  %s\n' \
            a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc \
            mcp-publisher.tar.gz | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate manifest
        run: ./mcp-publisher validate server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish reviewed manifest
        run: ./mcp-publisher publish server.json
